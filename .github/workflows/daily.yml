name: Daily weather load

on:
  schedule:
    # Three attempts a day: 06:17, 12:17 and 18:17 Africa/Lagos (UTC+1). Each run reloads
    # the last 7 days, so the first one that succeeds brings the data up to date and the
    # others just overwrite the same rows. Requests from GitHub's runners to Open-Meteo
    # fail intermittently, so one attempt a day isn't enough.
    # Off the hour on purpose: GitHub delays or drops scheduled runs most often at :00.
    - cron: "17 5,11,17 * * *"
  workflow_dispatch:       # "Run workflow" button, also used for backfills
    inputs:
      mode:
        description: daily (last 7 days) or backfill (needs start and end)
        type: choice
        options: [daily, backfill]
        default: daily
      start:
        description: "Backfill start, YYYY-MM-DD"
        required: false
      end:
        description: "Backfill end, YYYY-MM-DD"
        required: false

# Never run two loads at once; a second one waits for the first
concurrency:
  group: weather-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # to publish chart data to the `data` branch
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Inputs go through env, not straight into the script, so they can't inject shell code
      MODE: ${{ inputs.mode || 'daily' }}
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the database secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add a DATABASE_URL secret (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Run pipeline
        run: |
          if [ "$MODE" = "backfill" ]; then
            python -m src.pipeline --mode backfill --start "$START" --end "$END"
          else
            python -m src.pipeline --mode daily
          fi

      # Only when the load failed: time each stage of a connection to Open-Meteo, to show
      # whether it stalls looking up the address, connecting, in the secure handshake
      # (tls) or waiting for the reply. Never fails the job itself.
      - name: Diagnose Open-Meteo connection
        if: failure()
        continue-on-error: true
        run: |
          for url in \
            "https://api.open-meteo.com/v1/forecast?latitude=9.06&longitude=7.50&daily=temperature_2m_max&past_days=1&forecast_days=0" \
            "https://archive-api.open-meteo.com/v1/archive?latitude=9.06&longitude=7.50&daily=temperature_2m_max&start_date=2025-01-01&end_date=2025-01-02"; do
            host=$(echo "$url" | cut -d/ -f3)
            echo "== $host"
            getent ahosts "$host" | awk '{print $1}' | sort -u | tr '\n' ' '; echo
            for i in 1 2 3; do
              curl -sS -o /dev/null --max-time 60 \
                -w "attempt $i: http %{http_code}  ip %{remote_ip}  dns %{time_namelookup}s  connect %{time_connect}s  tls %{time_appconnect}s  first byte %{time_starttransfer}s  total %{time_total}s\n" \
                "$url" || echo "attempt $i: curl exit $?"
            done
          done

      # The runner is deleted after the job, so keep the raw API responses as an artifact
      - name: Keep raw JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-json-${{ github.run_id }}
          path: data/raw/
          retention-days: 30
          if-no-files-found: ignore

      # Runs even if one city failed: the others still loaded, so the charts stay current
      - name: Export chart data
        id: export
        if: ${{ !cancelled() }}
        run: python -m src.export --out exports

      # !cancelled() is needed: without a status function, GitHub silently adds success(),
      # which skips this step whenever any city failed
      - name: Publish chart data to the data branch
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish_data_branch.sh exports \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          echo "Chart data: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/" >> "$GITHUB_STEP_SUMMARY"
