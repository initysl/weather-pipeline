name: Daily weather load

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00 Africa/Lagos
  workflow_dispatch:       # "Run workflow" button, also used for backfills
    inputs:
      mode:
        description: daily (last 7 days) or backfill (needs start and end)
        type: choice
        options: [daily, backfill]
        default: daily
      start:
        description: "Backfill start, YYYY-MM-DD"
        required: false
      end:
        description: "Backfill end, YYYY-MM-DD"
        required: false

# Never run two loads at once; a second one waits for the first
concurrency:
  group: weather-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # to publish chart data to the `data` branch
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Inputs go through env, not straight into the script, so they can't inject shell code
      MODE: ${{ inputs.mode || 'daily' }}
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the database secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add a DATABASE_URL secret (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Run pipeline
        run: |
          if [ "$MODE" = "backfill" ]; then
            python -m src.pipeline --mode backfill --start "$START" --end "$END"
          else
            python -m src.pipeline --mode daily
          fi

      # The runner is deleted after the job, so keep the raw API responses as an artifact
      - name: Keep raw JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-json-${{ github.run_id }}
          path: data/raw/
          retention-days: 30
          if-no-files-found: ignore

      # Runs even if one city failed: the others still loaded, so the charts stay current
      - name: Export chart data
        id: export
        if: ${{ !cancelled() }}
        run: python -m src.export --out exports

      # !cancelled() is needed: without a status function, GitHub silently adds success(),
      # which skips this step whenever any city failed
      - name: Publish chart data to the data branch
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish_data_branch.sh exports \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          echo "Chart data: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/" >> "$GITHUB_STEP_SUMMARY"
